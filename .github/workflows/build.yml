name: Build Desktop App
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      
      - name: Download R Logo Icon
        run: |
          curl -sL "https://ui-avatars.com/api/?name=R&background=0e0e11&color=06b6d4&size=256&bold=true&format=png" -o icon.png

      - run: npm install
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: RGAMER-AI-Windows-Setup
          path: dist/*.exe
