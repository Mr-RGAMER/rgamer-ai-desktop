name: Build Desktop App
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      
      # ⬇️ YEH NAYA MAGIC STEP HAI ICON KE LIYE ⬇️
      - name: Download Icon
        run: |
          Invoke-WebRequest -Uri "https://rgamerai.vercel.app/icon.png" -OutFile "icon.png"
      
      - run: npm install
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: RGAMER-AI-Windows-Setup
          path: dist/*.exe
